spring:
  application:
    name: orbit
  threads:
    virtual:
      enabled: true
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orbit}
    username: ${SPRING_DATASOURCE_USERNAME:orbit}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
      timeout: 2s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: orbit
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

orbit:
  security:
    environment: ${ORBIT_ENV:development}
    api-token: ${ORBIT_API_TOKEN:local-dev-api-token-change-me}
    worker-token: ${ORBIT_WORKER_TOKEN:local-dev-worker-token-change-me}
    tenant-tokens: ${ORBIT_TENANT_TOKENS:}
    grpc-ca: ${ORBIT_GRPC_TLS_CA:}
    grpc-certificate: ${ORBIT_GRPC_TLS_CERT:}
    grpc-private-key: ${ORBIT_GRPC_TLS_KEY:}
  auth:
    admin-username: ${ORBIT_ADMIN_USERNAME:admin}
    admin-password: ${ORBIT_ADMIN_PASSWORD:}
    session-ttl-minutes: ${ORBIT_SESSION_TTL_MINUTES:480}
  role: ${ORBIT_ROLE:scheduler}
  monitoring:
    prometheus-url: ${ORBIT_PROMETHEUS_URL:http://localhost:9091}
    grafana-url: ${ORBIT_GRAFANA_URL:http://localhost:3000}
  grpc:
    port: ${ORBIT_GRPC_PORT:9090}
    host: ${ORBIT_GRPC_HOST:localhost}
  scheduler:
    dispatch-interval-ms: ${ORBIT_DISPATCH_INTERVAL_MS:500}
    lease-seconds: ${ORBIT_LEASE_SECONDS:30}
    heartbeat-timeout-seconds: ${ORBIT_HEARTBEAT_TIMEOUT_SECONDS:20}
    recovery-interval-ms: ${ORBIT_RECOVERY_INTERVAL_MS:5000}
    default-tenant-concurrency: ${ORBIT_DEFAULT_TENANT_CONCURRENCY:10}
  worker:
    id: ${ORBIT_WORKER_ID:}
    hostname: ${ORBIT_WORKER_HOSTNAME:}
    concurrency: ${ORBIT_WORKER_CONCURRENCY:8}
    poll-interval-ms: ${ORBIT_WORKER_POLL_INTERVAL_MS:350}
    heartbeat-interval-ms: ${ORBIT_WORKER_HEARTBEAT_INTERVAL_MS:5000}
    max-runtime-seconds: ${ORBIT_WORKER_MAX_RUNTIME_SECONDS:900}
    scheduler-host: ${ORBIT_SCHEDULER_HOST:orbit}
    scheduler-grpc-port: ${ORBIT_SCHEDULER_GRPC_PORT:9090}

logging:
  level:
    dev.orbit: INFO
    org.hibernate.SQL: WARN
